# cSpell: words unittests
name: Go build and test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/go.yaml"

jobs:
  build:
    name: Build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
    steps:
      - name: Set up Go 1.x
        uses: actions/setup-go@v6
        with:
          go-version: ^1
        id: go

      - name: Check out code into the Go module directory
        uses: actions/checkout@v7

      - name: Get dependencies
        run: go get -v -t -d ./...

      - name: Build
        run: go build -v .
        env:
          CGO_ENABLED: 0

      - name: Test
        run: |
          go test -v -race -covermode=atomic -coverprofile=coverage.out ./...
          go run hack/nocov.go coverage.out
          rm coverage.out
          mv coverage.out.nocov coverage.out

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        if: ${{ !cancelled() }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: unittests

      - name: Run runtime test
        run: |
          cd tests
          ./test_karmafun.sh
